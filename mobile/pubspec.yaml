name: gotogether
description: "GoTogether — trust-first travel community. Single Flutter codebase for Android and iOS."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation — official Flutter package, declarative routing matches the
  # multi-tab + nested-flow structure of the approved screens (bottom nav
  # with Home/Explore/Create/Chats/Profile, plus modal flows like Create Trip).
  go_router: ^14.2.7

  # State management — Riverpod chosen for compile-time-safe DI and easy
  # testability of ViewModels/notifiers; no feature code depends on this
  # deeply yet, so it can be swapped in Phase 1 if you'd rather use something
  # else (Bloc, Provider) — flagging this as an open architectural choice,
  # not a locked-in decision.
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.7.0

  # Secure JWT storage (access + refresh tokens) — Keychain on iOS, Keystore
  # on Android via a single API.
  flutter_secure_storage: ^9.2.2

  # Auth providers per Business Rules Module 1: Google Sign-In + Phone OTP
  # (OTP itself is a backend/Firebase Auth concern; this package only
  # handles the Google side of the Auth screen).
  google_sign_in: ^6.2.1

  # Push notifications — Firebase Cloud Messaging is the documented delivery
  # channel (Backend Architecture: "Firebase scoped only to push, not
  # auth/db"). Requires FlutterFire CLI setup (see mobile/README.md) before
  # this compiles against real Firebase config.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Design-system typography (Google Sans Text + Roboto per the approved
  # design set) without manually bundling font files.
  google_fonts: ^6.2.1

  # Image loading/caching for trip photos, avatars, verification uploads.
  cached_network_image: ^3.4.1

  # Camera/gallery picker for profile photo + trip photo upload — added
  # alongside the presigned-URL upload flow (StorageService on the backend);
  # there was no image-selection package in the app before this.
  image_picker: ^1.1.2

  # Date/number formatting for trip dates, trust scores, etc.
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

  # Emergency call (tel:) and support email (mailto:) links on the Help &
  # Support screen — the only cross-platform way to hand off to the phone's
  # own dialer/mail app rather than faking either inside the app.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
