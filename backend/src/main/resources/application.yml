spring:
  application:
    name: gotogether-backend
  profiles:
    active: dev

  datasource:
    # Port 5433, not the Postgres default 5432 — something else on the dev
    # machine this was set up on already owned 5432, so docker-compose.yml
    # maps this project's Postgres to 5433 on the host instead (see the
    # repo-root .env file). Override with a real DB_URL env var only if
    # your own machine's setup differs.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gotogether}
    username: ${DB_USERNAME:gotogether}
    password: ${DB_PASSWORD:gotogether}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema — Hibernate must never auto-generate DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Local docker-compose Redis has no auth/TLS at all, hence the blank/
      # false defaults below — added for cloud deployment, where a managed
      # Redis add-on (Railway, Upstash, etc.) almost always requires both.
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  jackson:
    # API Specification Section 1: "snake_case throughout for direct DB-field
    # correspondence." Phase 1's DTOs were written as plain camelCase Java
    # records with no naming strategy, so the backend was actually emitting
    # camelCase JSON until this was caught during the Phase 2 docs review
    # (2026-07-22) — this one line fixes every endpoint, old and new, without
    # needing @JsonProperty on any individual field. The three Phase 1 Flutter
    # model files (auth/user/profile) were updated in the same pass to parse
    # snake_case instead of camelCase.
    property-naming-strategy: SNAKE_CASE

server:
  # Not 8080 — a separate, unrelated project on this dev machine
  # (`de_project_airflow_webserver`) permanently owns that port, confirmed
  # via `docker ps` 2026-07-22. Override with SERVER_PORT if your own
  # machine's setup differs.
  port: ${SERVER_PORT:8081}

gotogether:
  twilio:
    # Real SMS delivery for phone OTP via Twilio VERIFY (see OtpSenderConfig
    # for exactly how this decides between TwilioOtpSender and the dev-only
    # LoggingOtpSender fallback; see TwilioOtpSender for why Verify, not the
    # plain Messages API — trial accounts reject custom message bodies).
    # Leave account-sid blank for local dev — OTP codes just get logged
    # instead of texted, no Twilio account needed.
    #
    # Get real values from twilio.com/console:
    #   account-sid / auth-token — top of the console dashboard.
    #   verify-service-sid — Verify > Services > create one (one-time setup,
    #     separate from any phone number you bought); copy its SID (starts
    #     with "VA").
    # Note: Twilio TRIAL accounts can only send to phone numbers you've
    # manually verified in the console first (Phone Numbers > Manage >
    # Verified Caller IDs) — fine for a handful of known testers, not open
    # testing.
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  jwt:
    # Local-dev-only default secret. MUST be overridden via env var in every real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-shared-environment-use-32-bytes-min}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 90
  storage:
    bucket: ${STORAGE_BUCKET:gotogether-dev}
    # This backend's own view of MinIO — correct as-is, since both the
    # backend process and the MinIO container run on the same machine
    # (docker-compose maps MinIO's S3 API to host port 9000).
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    # What gets baked into every presigned URL StorageService hands back to
    # the MOBILE APP — this is a different question from the line above, and
    # answering it with the same default is exactly what caused "the photo
    # is not uploading": an Android emulator's `localhost` refers to the
    # emulator itself, not this machine (same problem AppConfig.apiBaseUrl
    # already solves for the main API on the Flutter side, via 10.0.2.2).
    # Override for your actual test target:
    #   Android emulator:  STORAGE_PUBLIC_ENDPOINT=http://10.0.2.2:9000
    #   iOS simulator:     no override needed, shares this machine's localhost
    #   physical device:   STORAGE_PUBLIC_ENDPOINT=http://<this-machine-LAN-IP>:9000
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    # Defaults match docker-compose.yml's minio service (MINIO_ROOT_USER/
    # PASSWORD), same pattern as datasource.username/password matching the
    # postgres service above — override via env var only if your own
    # MinIO setup differs. The bucket itself is NOT auto-created by
    # docker-compose (MinIO doesn't create buckets on boot) — one-time setup
    # after the containers are up:
    #   docker exec gotogether-minio mc alias set local http://localhost:9000 gotogether gotogether123
    #   docker exec gotogether-minio mc mb local/gotogether-dev
    #   docker exec gotogether-minio mc anonymous set download local/gotogether-dev
    # The last command makes the bucket public-read, required because
    # StorageService's public_url is an unsigned URL (no read-side signing
    # implemented) — profile photos and trip images are just not private
    # data, unlike verification documents.
    access-key: ${STORAGE_ACCESS_KEY:gotogether}
    secret-key: ${STORAGE_SECRET_KEY:gotogether123}
    # Off by default — preserves the exact raw-bucket-URL behavior above,
    # correct for local MinIO (public-read bucket). Flip to true for any
    # S3-compatible target that doesn't support public buckets (e.g. Railway
    # Storage Buckets) — see StorageProperties' class doc for the full
    # explanation. api-public-base-url must then be set to whatever host the
    # mobile client reaches THIS backend at (its own public URL, not the
    # bucket's) — e.g. the Railway-generated domain in a cloud deployment.
    serve-via-proxy: ${STORAGE_SERVE_VIA_PROXY:false}
    api-public-base-url: ${API_PUBLIC_BASE_URL:}
  photos:
    # Pexels API key for GET /photos/search (stock destination photos for
    # trip cover/gallery uploads). No local-dev fallback exists like
    # storage's MinIO defaults do — get a free key at pexels.com/api and set
    # it as an env var. Left blank, PexelsService fails clearly (422) rather
    # than sending an unauthenticated request upstream.
    pexels-api-key: ${PEXELS_API_KEY:}

logging:
  level:
    com.gotogether: INFO
    org.hibernate.SQL: WARN
